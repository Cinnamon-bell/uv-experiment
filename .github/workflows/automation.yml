name: Scheduled automation

on:
  schedule:
    - cron: "0 8 * * *"      # Every day at 08:00 UTC
    - cron: "30 18 * * 1"    # Every Monday at 18:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-job:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run automation script
        working-directory: .github/workflows
        run: uv run main.py

      - name: Read repository secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Repository secret is available."
          echo "Length: ${#MY_SECRET}"

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automation_success.txt

          git diff --cached --quiet || git commit -m "Daily automation update"

          git push

  weekly-job:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 18 * * 1'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create weekly report
        run: |
          echo "Weekly report generated on $(date)" >> weekly_report.txt

      - name: Commit weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly_report.txt

          git diff --cached --quiet || git commit -m "Weekly report update"

          git push